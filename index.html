<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>語言實驗</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #fafaf9;
    --surface: #ffffff;
    --border: #e5e3dc;
    --text: #1a1a18;
    --text-muted: #6b6b67;
    --accent: #534ab7;
    --accent-light: #eeedfe;
    --success: #1d9e75;
    --danger: #e24b4a;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181a; --surface: #232325; --border: #3a3a3c;
      --text: #e8e6e0; --text-muted: #888884; --accent: #7f77dd;
      --accent-light: #26215c; --success: #5dcaa5; --danger: #f09595;
    }
  }

  body {
    font-family: -apple-system, 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.7;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 40px;
    width: 100%;
    max-width: 640px;
  }

  h1 { font-size: 22px; font-weight: 500; margin-bottom: 16px; }
  h2 { font-size: 18px; font-weight: 500; margin-bottom: 12px; }
  p  { color: var(--text-muted); margin-bottom: 12px; font-size: 15px; }
  p.main { color: var(--text); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 10px 24px; border-radius: 8px; border: none;
    font-size: 15px; font-weight: 500; cursor: pointer;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-outline {
    background: transparent; color: var(--accent);
    border: 1.5px solid var(--accent);
  }
  .btn-lg { padding: 14px 40px; font-size: 17px; width: 100%; }

  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block; font-size: 14px; font-weight: 500;
    margin-bottom: 6px; color: var(--text);
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%; padding: 10px 14px;
    border: 1.5px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text);
    font-size: 15px; transition: border-color .15s;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline: none; border-color: var(--accent);
  }
  .form-group .hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  .radio-group { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
  .radio-opt {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 8px;
    border: 1.5px solid var(--border);
    cursor: pointer; font-size: 14px; transition: border-color .15s;
  }
  .radio-opt:has(input:checked) { border-color: var(--accent); background: var(--accent-light); }
  .radio-opt input { width: 16px; height: 16px; accent-color: var(--accent); }

  /* 試次畫面 */
  #trial-screen { text-align: center; }
  #fixation {
    font-size: 40px; color: var(--text-muted);
    min-height: 120px; display: flex; align-items: center; justify-content: center;
  }
  #prime-display {
    font-size: 52px; font-weight: 500; letter-spacing: 0.08em;
    min-height: 120px; display: flex; align-items: center; justify-content: center;
    color: var(--text);
  }
  #audio-status {
    font-size: 14px; color: var(--text-muted);
    min-height: 60px; display: flex; align-items: center; justify-content: center;
    gap: 8px;
  }
  .spinner {
    width: 18px; height: 18px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #response-area {
    display: flex; gap: 16px; justify-content: center; margin-top: 24px;
  }
  .resp-btn {
    flex: 1; max-width: 180px; padding: 20px;
    border-radius: var(--radius); border: 2px solid var(--border);
    background: var(--surface); color: var(--text);
    font-size: 17px; font-weight: 500; cursor: pointer;
    transition: all .1s;
  }
  .resp-btn:hover { border-color: var(--accent); background: var(--accent-light); }
  .resp-btn:disabled { opacity: .3; cursor: not-allowed; }
  .resp-btn.word  { border-color: var(--success); }
  .resp-btn.nonword { border-color: var(--danger); }

  #feedback-area {
    min-height: 40px; display: flex; align-items: center;
    justify-content: center; font-size: 20px; font-weight: 500;
    margin-top: 8px;
  }
  .fb-correct { color: var(--success); }
  .fb-wrong   { color: var(--danger); }

  /* 進度條 */
  .progress-wrap {
    margin-bottom: 28px;
  }
  .progress-label {
    font-size: 13px; color: var(--text-muted); margin-bottom: 6px;
    display: flex; justify-content: space-between;
  }
  .progress-bar-bg {
    height: 6px; background: var(--border); border-radius: 99px; overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%; background: var(--accent);
    border-radius: 99px; transition: width .3s;
  }

  /* 鍵盤提示 */
  .key-hint {
    font-size: 13px; color: var(--text-muted); margin-top: 8px; text-align: center;
  }
  .key-badge {
    display: inline-block; padding: 2px 8px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; font-family: monospace; font-size: 12px;
  }

  /* 結果頁 */
  .result-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; margin: 20px 0;
  }
  .result-cell {
    background: var(--bg); border-radius: 8px; padding: 16px; text-align: center;
  }
  .result-cell .num { font-size: 28px; font-weight: 500; color: var(--accent); }
  .result-cell .lbl { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

  /* 工具列 (設定工具) */
  #config-banner {
    background: var(--accent-light); border: 1.5px solid var(--accent);
    border-radius: 8px; padding: 12px 16px;
    font-size: 13px; color: var(--text); margin-bottom: 24px;
    display: flex; align-items: center; gap: 8px;
  }
  #config-banner input {
    flex: 1; border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font-size: 13px;
    background: var(--surface); color: var(--text);
  }

  .hidden { display: none !important; }
  .phase-label {
    display: inline-block; font-size: 12px; font-weight: 500;
    padding: 3px 10px; border-radius: 99px; margin-bottom: 16px;
    background: var(--accent-light); color: var(--accent);
  }
  .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
</style>
</head>
<body>

<!-- ===== 設定 GAS URL ===== -->
<div id="screen-setup" class="card hidden">
  <h1>實驗系統設定</h1>
  <p>請輸入 Google Apps Script 部署後的 Web App URL，僅在設定時需要輸入一次。</p>
  <div class="form-group">
    <label>GAS Web App URL</label>
    <input type="url" id="gas-url-input" placeholder="https://script.google.com/macros/s/...">
    <div class="hint">部署後在「管理部署」頁面複製 URL</div>
  </div>
  <button class="btn btn-primary" onclick="saveGasUrl()">儲存並進入實驗</button>
</div>

<!-- ===== 載入中 ===== -->
<div id="screen-loading" class="card hidden">
  <div style="text-align:center; padding: 40px 0;">
    <div class="spinner" style="width:32px;height:32px;border-width:3px;margin:0 auto 16px;"></div>
    <p>載入實驗設定中...</p>
  </div>
</div>

<!-- ===== 歡迎與同意書 ===== -->
<div id="screen-welcome" class="card hidden">
  <h1 id="welcome-title"></h1>
  <div id="welcome-body" style="margin-bottom:20px;"></div>
  <hr class="divider">
  <div id="consent-text" style="font-size:14px;color:var(--text-muted);margin-bottom:20px;"></div>
  <button class="btn btn-primary btn-lg" onclick="goToSurvey()">我已閱讀並同意參與</button>
</div>

<!-- ===== 受試者基本資料 ===== -->
<div id="screen-survey" class="card hidden">
  <h2>基本資料</h2>
  <p>以下資料僅供研究分析，不會揭露個人身分。</p>
  <div id="survey-form"></div>
  <button class="btn btn-primary" onclick="submitSurvey()">繼續</button>
</div>

<!-- ===== 練習題說明 ===== -->
<div id="screen-practice-intro" class="card hidden">
  <span class="phase-label">練習階段</span>
  <h2>練習說明</h2>
  <div id="practice-instruction-text" style="margin-bottom:20px;"></div>
  <div style="background:var(--bg);border-radius:8px;padding:16px;margin-bottom:20px;font-size:14px;">
    <strong>按鍵對應：</strong><br>
    <span class="key-badge">F</span> = 台語真實詞彙&nbsp;&nbsp;
    <span class="key-badge">J</span> = 非詞（不是台語詞彙）<br>
    或直接點擊畫面上的按鈕
  </div>
  <button class="btn btn-primary btn-lg" onclick="startPhase('practice')">開始練習</button>
</div>

<!-- ===== 正式實驗說明 ===== -->
<div id="screen-experiment-intro" class="card hidden">
  <span class="phase-label">正式實驗</span>
  <h2>正式實驗說明</h2>
  <div id="experiment-instruction-text" style="margin-bottom:20px;"></div>
  <button class="btn btn-primary btn-lg" onclick="startPhase('experiment')">開始實驗</button>
</div>

<!-- ===== 試次畫面 ===== -->
<div id="screen-trial" class="card hidden">
  <div class="progress-wrap">
    <div class="progress-label">
      <span id="progress-text">0 / 0</span>
      <span id="phase-badge" class="phase-label" style="margin:0;"></span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>

  <div id="trial-screen">
    <div id="fixation">+</div>
    <div id="prime-display" class="hidden"></div>
    <div id="audio-status">
      <div class="spinner hidden" id="loading-spinner"></div>
      <span id="audio-status-text"></span>
    </div>
    <div id="response-area">
      <button class="resp-btn word" id="btn-word" disabled onclick="recordResponse(true)">
        詞彙<br><small style="font-weight:400;font-size:13px;">(F)</small>
      </button>
      <button class="resp-btn nonword" id="btn-nonword" disabled onclick="recordResponse(false)">
        非詞<br><small style="font-weight:400;font-size:13px;">(J)</small>
      </button>
    </div>
    <div id="feedback-area"></div>
    <div class="key-hint">按 <span class="key-badge">F</span> 詞彙 &nbsp;|&nbsp; <span class="key-badge">J</span> 非詞</div>
  </div>
</div>

<!-- ===== 結果頁 ===== -->
<div id="screen-result" class="card hidden">
  <h2>實驗完成，謝謝您的參與！</h2>
  <div class="result-grid" id="result-stats"></div>
  <p id="result-msg"></p>
  <div id="saving-status" style="font-size:14px;color:var(--text-muted);margin-top:12px;"></div>
</div>

<script>
// ============================================================
// 全域狀態
// ============================================================
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzB8gAwM0lLUZfAzACO9TmMeaMNPwAeBG4yH7RzRtB88CSrWm7qOhV5k72Fw4Pqmu7t/exec';

let config = {};
let allTrials = [];
let practiceTrials = [];
let experimentTrials = [];

let currentPhase = '';       // 'practice' | 'experiment'
let currentTrialList = [];
let currentIndex = 0;

let surveyData = {};
let sessionId = '';
let trialResults = [];

// RT 計時
let rtStart = null;
let responseEnabled = false;
let timeoutHandle = null;
let audioCtx = null;

// ============================================================
// 初始化
// ============================================================
window.onload = () => {
  sessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
  showScreen('loading');
  loadConfig();
};

function saveGasUrl() {
  showScreen('loading');
  loadConfig();
}

// ============================================================
// 從 GAS 載入設定與題目
// ============================================================
async function loadConfig() {
  try {
    const [cfgRes, trialsRes] = await Promise.all([
      fetch(`${GAS_URL}?action=getConfig`).then(r => r.json()),
      fetch(`${GAS_URL}?action=getTrials`).then(r => r.json())
    ]);

    config = cfgRes.config;
    allTrials = trialsRes.trials;

    practiceTrials   = allTrials.filter(t => t.type === 'practice');
    experimentTrials = allTrials.filter(t => t.type === 'experiment');

    // 隨機化實驗題目順序
    experimentTrials = shuffle(experimentTrials);

    renderWelcome();
    showScreen('welcome');
  } catch(e) {
    showScreen('loading');
    alert('載入失敗，請確認 GAS URL 是否正確：\n' + e.message);
  }
}

// ============================================================
// 歡迎頁
// ============================================================
function renderWelcome() {
  document.getElementById('welcome-title').textContent =
    config.welcome_title || '歡迎參與語言研究';
  document.getElementById('welcome-body').innerHTML =
    (config.welcome_body || '').replace(/\n/g, '<br>');
  document.getElementById('consent-text').innerHTML =
    (config.consent_text || '').replace(/\n/g, '<br>');
}

function goToSurvey() {
  renderSurveyForm();
  showScreen('survey');
}

// ============================================================
// 受試者基本資料表單
// ============================================================
function renderSurveyForm() {
  const fields = config.survey_fields || defaultSurveyFields();
  const form = document.getElementById('survey-form');
  form.innerHTML = '';

  fields.forEach(field => {
    const group = document.createElement('div');
    group.className = 'form-group';

    const label = document.createElement('label');
    label.textContent = field.label + (field.required ? ' *' : '');
    group.appendChild(label);

    if (field.type === 'text' || field.type === 'number') {
      const inp = document.createElement('input');
      inp.type = field.type;
      inp.id = 'survey_' + field.key;
      inp.placeholder = field.placeholder || '';
      group.appendChild(inp);
    } else if (field.type === 'select') {
      const sel = document.createElement('select');
      sel.id = 'survey_' + field.key;
      sel.innerHTML = '<option value="">請選擇...</option>' +
        field.options.map(o => `<option value="${o}">${o}</option>`).join('');
      group.appendChild(sel);
    } else if (field.type === 'radio') {
      const radioWrap = document.createElement('div');
      radioWrap.className = 'radio-group';
      field.options.forEach(opt => {
        const lbl = document.createElement('label');
        lbl.className = 'radio-opt';
        lbl.innerHTML = `<input type="radio" name="survey_${field.key}" value="${opt}"> ${opt}`;
        radioWrap.appendChild(lbl);
      });
      group.appendChild(radioWrap);
    }

    if (field.hint) {
      const hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = field.hint;
      group.appendChild(hint);
    }

    form.appendChild(group);
  });
}

function defaultSurveyFields() {
  return [
    { key: 'age', label: '年齡', type: 'number', required: true },
    { key: 'gender', label: '性別', type: 'radio',
      options: ['男', '女', '非二元性別', '不願透露'], required: true },
    { key: 'taiwanese_level', label: '台語能力自評（1=完全不會，5=母語）',
      type: 'radio', options: ['1','2','3','4','5'], required: true },
    { key: 'mandarin_level', label: '華語能力自評（1=初學，5=母語）',
      type: 'radio', options: ['1','2','3','4','5'], required: true },
    { key: 'bilingual_age', label: '幾歲開始接觸台語（若無可填0）',
      type: 'number', required: false },
  ];
}

function submitSurvey() {
  const fields = config.survey_fields || defaultSurveyFields();
  const missing = [];
  surveyData = {};

  fields.forEach(field => {
    let val = '';
    if (field.type === 'radio') {
      const checked = document.querySelector(`input[name="survey_${field.key}"]:checked`);
      val = checked ? checked.value : '';
    } else {
      const el = document.getElementById('survey_' + field.key);
      val = el ? el.value.trim() : '';
    }
    surveyData[field.key] = val;
    if (field.required && !val) missing.push(field.label);
  });

  if (missing.length) {
    alert('以下欄位尚未填寫：\n' + missing.join('\n'));
    return;
  }

  renderInstruction('practice-instruction-text', config.practice_instruction,
    '接下來會有幾題練習題，讓您熟悉實驗流程。\n每題您會先看到一個華語詞彙（Prime），接著聽到一個台語詞彙的發音。\n請判斷您聽到的是否為真實的台語詞彙，越快越準確越好。');
  showScreen('practice-intro');
}

// ============================================================
// 實驗流程
// ============================================================
function startPhase(phase) {
  currentPhase = phase;
  trialResults = phase === 'practice' ? [] : trialResults;
  currentTrialList = phase === 'practice' ? practiceTrials : experimentTrials;
  currentIndex = 0;

  if (currentTrialList.length === 0) {
    if (phase === 'practice') {
      goToExperimentIntro();
    } else {
      finishExperiment();
    }
    return;
  }

  showScreen('trial');
  runNextTrial();
}

function runNextTrial() {
  if (currentIndex >= currentTrialList.length) {
    if (currentPhase === 'practice') {
      goToExperimentIntro();
    } else {
      finishExperiment();
    }
    return;
  }

  const trial = currentTrialList[currentIndex];
  updateProgress();
  runTrial(trial);
}

async function runTrial(trial) {
  clearFeedback();
  disableResponse();
  resetUI();

  const iti = parseInt(config.iti_ms) || 800;
  const primeDur = parseInt(config.prime_ms) || 300;
  const timeout = parseInt(config.response_timeout_ms) || 2000;

  // 隨機分配 prime
  const primeAssigned = Math.random() < 0.5 ? 'A' : 'B';
  const primeText = primeAssigned === 'A' ? trial.prime_a : trial.prime_b;

  // 記錄分配的 prime（供儲存用）
  trial._primeAssigned = primeAssigned;
  trial._primeText = primeText;

  // ── 1. ITI 注視點 ──
  showElement('fixation', '+');
  hideElement('prime-display');
  setAudioStatus('');
  await sleep(iti);

  // ── 2. 呈現 Prime ──
  hideElement('fixation');
  showElement('prime-display', primeText);
  await sleep(primeDur);

  // ── 3. 隱藏 Prime，載入音訊 ──
  hideElement('prime-display');
  showElement('fixation', '');
  setAudioStatus('', true); // 顯示 spinner

  let audioBuffer = null;
  try {
    audioBuffer = await loadAudio(trial.target_url);
  } catch(e) {
    setAudioStatus('音訊載入失敗，請聯繫實驗者');
    console.error(e);
    await sleep(2000);
    advanceTrial(trial, null, null, true, 'audio_load_error');
    return;
  }

  // ── 4. 播放音訊，onended 啟動計時 ──
  setAudioStatus('', false);
  hideElement('fixation');

  rtStart = null;
  responseEnabled = false;

  playAudioBuffer(audioBuffer, () => {
    rtStart = performance.now();
    enableResponse();
    setAudioStatus('請判斷：詞彙 (F) 或 非詞 (J)？');

    // 超時處理
    timeoutHandle = setTimeout(() => {
      if (responseEnabled) {
        disableResponse();
        advanceTrial(trial, null, null, true, '');
      }
    }, timeout);
  });
}

function recordResponse(isWord) {
  if (!responseEnabled) return;
  const rt = performance.now() - rtStart;
  clearTimeout(timeoutHandle);
  disableResponse();

  const trial = currentTrialList[currentIndex];
  const accuracy = (isWord === trial.answer) ? 1 : 0;

  // 練習題才顯示 feedback
  if (currentPhase === 'practice') {
    showFeedback(accuracy === 1);
  }

  advanceTrial(trial, isWord, rt, false, '');
}

function advanceTrial(trial, response, rt, timedOut, notes) {
  if (currentPhase === 'experiment' || currentPhase === 'practice') {
    trialResults.push({
      trial_index:    currentIndex,
      type:           currentPhase,
      item_id:        trial.item_id,
      prime_assigned: trial._primeAssigned || '',
      prime_text:     trial._primeText || '',
      target_url:     trial.target_url,
      correct_answer: trial.answer,
      response:       response,
      accuracy:       response !== null ? (response === trial.answer ? 1 : 0) : null,
      rt_ms:          rt ? Math.round(rt) : null,
      timed_out:      timedOut,
      notes:          notes || trial.notes || ''
    });
  }

  currentIndex++;
  const delay = currentPhase === 'practice' ? 600 : 300;
  setTimeout(runNextTrial, delay);
}

// ============================================================
// 音訊處理
// ============================================================
function getAudioCtx() {
  if (!audioCtx || audioCtx.state === 'closed') {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

async function loadAudio(url) {
  const ctx = getAudioCtx();
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const arrayBuffer = await res.arrayBuffer();
  return ctx.decodeAudioData(arrayBuffer);
}

function playAudioBuffer(buffer, onEnded) {
  const ctx = getAudioCtx();
  const source = ctx.createBufferSource();
  source.buffer = buffer;
  source.connect(ctx.destination);
  source.onended = onEnded;
  source.start();
}

// ============================================================
// 正式實驗說明
// ============================================================
function goToExperimentIntro() {
  renderInstruction('experiment-instruction-text', config.experiment_instruction,
    '練習完成！接下來是正式實驗，流程與練習相同。\n正式實驗中不會再顯示答案對錯，請盡量快速並正確地回答。');
  showScreen('experiment-intro');
}

// ============================================================
// 結果頁與資料送出
// ============================================================
function finishExperiment() {
  const validTrials = trialResults.filter(t => !t.timed_out && t.rt_ms !== null);
  const correctTrials = validTrials.filter(t => t.accuracy === 1);
  const avgRt = validTrials.length
    ? Math.round(validTrials.reduce((s, t) => s + t.rt_ms, 0) / validTrials.length)
    : 0;
  const acc = trialResults.length
    ? Math.round(correctTrials.length / trialResults.length * 100)
    : 0;

  document.getElementById('result-stats').innerHTML = `
    <div class="result-cell"><div class="num">${trialResults.length}</div><div class="lbl">完成題數</div></div>
    <div class="result-cell"><div class="num">${acc}%</div><div class="lbl">正確率</div></div>
    <div class="result-cell"><div class="num">${avgRt}</div><div class="lbl">平均 RT (ms)</div></div>
    <div class="result-cell"><div class="num">${trialResults.filter(t=>t.timed_out).length}</div><div class="lbl">超時次數</div></div>
  `;
  document.getElementById('result-msg').textContent =
    config.result_message || '您的資料已記錄，感謝配合！';

  showScreen('result');
  saveResultsToSheet();
}

async function saveResultsToSheet() {
  const status = document.getElementById('saving-status');
  status.textContent = '資料傳送中...';

  const deviceInfo = collectDeviceInfo();

  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        action: 'saveResults',
        session_id: sessionId,
        participant_id: surveyData.participant_id || sessionId,
        survey_data: surveyData,
        device_info: deviceInfo,
        trial_results: trialResults
      })
    });
    const data = await res.json();
    if (data.ok) {
      status.textContent = `資料已成功儲存（${data.saved} 筆）`;
      status.style.color = 'var(--success)';
    } else {
      throw new Error(data.error);
    }
  } catch(e) {
    status.textContent = '資料傳送失敗，請告知實驗者。錯誤：' + e.message;
    status.style.color = 'var(--danger)';
    // fallback: 存到 localStorage
    localStorage.setItem('priming_backup_' + sessionId,
      JSON.stringify({ surveyData, trialResults, deviceInfo }));
    status.textContent += '（已備份至本機）';
  }
}

// ============================================================
// 裝置資訊
// ============================================================
function collectDeviceInfo() {
  const ua = navigator.userAgent;
  let audioLatency = null;
  try {
    const ctx = new AudioContext();
    audioLatency = Math.round(ctx.baseLatency * 1000);
    ctx.close();
  } catch(e) {}

  return {
    is_mobile: /Android|iPhone|iPad/i.test(ua),
    os: /iPhone|iPad|Mac/.test(ua) ? 'iOS/macOS'
       : /Android/.test(ua) ? 'Android'
       : /Windows/.test(ua) ? 'Windows' : 'Other',
    browser: /Chrome/.test(ua) && !/Edg/.test(ua) ? 'Chrome'
           : /Firefox/.test(ua) ? 'Firefox'
           : /Safari/.test(ua) ? 'Safari'
           : /Edg/.test(ua) ? 'Edge' : 'Other',
    audio_base_latency_ms: audioLatency,
    hardware_concurrency: navigator.hardwareConcurrency || null,
    user_agent: ua
  };
}

// ============================================================
// UI 工具函式
// ============================================================
function showScreen(name) {
  document.querySelectorAll('[id^="screen-"]').forEach(el => el.classList.add('hidden'));
  document.getElementById('screen-' + name)?.classList.remove('hidden');
}

function showElement(id, text) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.remove('hidden');
  if (text !== undefined) el.textContent = text;
}

function hideElement(id) {
  document.getElementById(id)?.classList.add('hidden');
}

function setAudioStatus(msg, showSpinner = false) {
  document.getElementById('audio-status-text').textContent = msg;
  const sp = document.getElementById('loading-spinner');
  showSpinner ? sp.classList.remove('hidden') : sp.classList.add('hidden');
}

function enableResponse() {
  responseEnabled = true;
  document.getElementById('btn-word').disabled = false;
  document.getElementById('btn-nonword').disabled = false;
}

function disableResponse() {
  responseEnabled = false;
  document.getElementById('btn-word').disabled = true;
  document.getElementById('btn-nonword').disabled = true;
}

function resetUI() {
  document.getElementById('feedback-area').textContent = '';
  document.getElementById('feedback-area').className = '';
}

function clearFeedback() {
  document.getElementById('feedback-area').textContent = '';
}

function showFeedback(correct) {
  const el = document.getElementById('feedback-area');
  el.textContent = correct ? '✓ 正確' : '✗ 錯誤';
  el.className = correct ? 'fb-correct' : 'fb-wrong';
}

function updateProgress() {
  const total = currentTrialList.length;
  const done = currentIndex;
  document.getElementById('progress-text').textContent = `${done} / ${total}`;
  document.getElementById('progress-fill').style.width = `${(done / total) * 100}%`;
  document.getElementById('phase-badge').textContent =
    currentPhase === 'practice' ? '練習' : '正式實驗';
}

function renderInstruction(elId, text, fallback) {
  const el = document.getElementById(elId);
  el.innerHTML = (text || fallback).replace(/\n/g, '<br>');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ============================================================
// 鍵盤控制
// ============================================================
document.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'KeyF') recordResponse(true);
  if (e.code === 'KeyJ') recordResponse(false);
});

// 第一次互動時初始化 AudioContext（瀏覽器政策需要）
document.addEventListener('click', () => { getAudioCtx(); }, { once: true });
</script>
